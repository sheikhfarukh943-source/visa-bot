<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>লগইন - স্লট সহকারী</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">সিস্টেম লগইন</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label">ইউজারনেম / ইমেইল</label>
                        <input type="text" class="form-control" required placeholder="আপনার ইউজারনেম দিন">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">পাসওয়ার্ড</label>
                        <input type="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <a href="/" class="btn btn-primary w-100">লগইন করুন</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
