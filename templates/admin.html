<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>SlotBuddy - Advanced Admin Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .dashboard { max-width: 1100px; margin: 0 auto; }
        h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-top: 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { padding: 10px 20px; background: #ef4444; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        
        .section-grid { display: flex; gap: 25px; margin-bottom: 30px; }
        .box { flex: 1; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h3 { margin-top: 0; color: #38bdf8; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 8px; }
        button:hover { background: #0369a1; }

        .metrics { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .card h2 { margin: 0; font-size: 28px; color: #38bdf8; }
        .card p { margin: 5px 0 0 0; color: #94a3b8; font-size: 13px; }
        
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-Success { background: #065f46; color: #34d399; }
        .status-Pending { background: #854d0e; color: #fef08a; }
        .status-Failed { background: #991b1b; color: #f87171; }
        
        #bot-log-box { margin-top: 10px; padding: 10px; border-radius: 6px; text-align: center; font-size: 13px; display: none; font-weight: bold; }
        #otp-zone { display: none; margin-top: 15px; padding: 15px; background: #1e293b; border: 2px dashed #eab308; border-radius: 8px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-top">
        <h1>SlotBuddy IVAC প্রফেশনাল কন্ট্রোল প্যানেল</h1>
        <a href="/logout" class="logout-btn">🚪 লগআউট</a>
    </div>
    
    <div class="section-grid">
        <!-- ১. তথ্য ও ওয়েব ফাইল আপলোড সেকশন (আপনার কাঙ্ক্ষিত ফিচার) -->
        <div class="box">
            <h3>📤 তথ্য ও ওয়েব ফাইল আপলোড প্যানেল</h3>
            <form id="ivac-upload-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label>ভিসা সেন্টার</label>
                    <select name="center" id="center">
                        <option value="Dhaka">Dhaka (Jamuna Future Park)</option>
                        <option value="Chittagong">Chittagong</option>
                        <option value="Sylhet">Sylhet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>পাসপোর্ট নম্বর</label>
                    <input type="text" name="passport" id="passport" required>
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর</label>
                    <input type="text" name="phone" id="phone" required>
                </div>
                <div class="form-group">
                    <label>ওয়েব ফাইল (PDF/Image)</label>
                    <input type="file" name="web_file" id="web_file" required>
                </div>
                <button type="button" onclick="uploadDataFromAdmin()">বট সচল ও ফাইল প্রিলোড করুন</button>
            </form>
            <div id="bot-log-box"></div>
            
            <div id="otp-zone">
                <label style="color: #eab308; font-weight: bold;">OTP কোডটি দিন:</label>
                <input type="text" id="otp-val" placeholder="XXXXXX" maxlength="6" style="text-align: center; font-size: 18px;">
                <button type="button" onclick="submitAdminOtp()" style="background:#eab308; color: #0f172a; margin-top: 8px;">ওটিপি নিশ্চিত করুন</button>
            </div>
            <div id="payment-container" style="margin-top:10px;"></div>
        </div>
        
        <!-- ২. নতুন ব্যবহারকারী তৈরির সেকশন (৪ জন ইউজার লিমিট করার জন্য) -->
        <div class="box">
            <h3>👥 ব্যবহারকারী ব্যবস্থাপনা (User Accounts)</h3>
            <div class="form-group">
                <label>ইউজারনেম</label>
                <input type="text" id="new-user" placeholder="Username">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="new-pass" placeholder="Password">
            </div>
            <div class="form-group">
                <label>অ্যাকাউন্ট রোল</label>
                <select id="new-role">
                    <option value="Admin">অ্যাডমিন (Admin/Primary)</option>
                    <option value="User">সহকারী ব্যবহারকারী (User)</option>
                </select>
            </div>
            <button type="button" onclick="createUserAccount()" style="background: #22c55e;">নতুন অ্যাকাউন্ট তৈরি করুন</button>
        </div>
    </div>
    
    <!-- পরিসংখ্যান কার্ডসমূহ -->
    <div class="metrics">
        <div class="card"><h2><span id="total-uploads">0</span>/4</h2><p>সক্রিয় আপলোড স্লট</p></div>
        <div class="card"><h2 id="success-count" style="color: #22c55e;">0</h2><p>সফল বুকিং</p></div>
        <div class="card"><h2 id="failed-count" style="color: #ef4444;">0</h2><p>ব্যর্থ সেশন</p></div>
    </div>

    <h3>📋 লাইভ ফাইল ও সেশন ট্র্যাকিং লগ</h3>
    <table>
        <thead>
            <tr>
                <th>সময়</th>
                <th>পাসপোর্ট নম্বর</th>
                <th>ভিসা সেন্টার</th>
                <th>ফাইলের নাম</th>
                <th>বর্তমান অবস্থা</th>
            </tr>
        </thead>
        <tbody id="log-table-body"></tbody>
    </table>
</div>

<script>
    let activeSessionKey = null;
    let trackLoop = null;

    async function uploadDataFromAdmin() {
        const form = document.getElementById('ivac-upload-form');
        const formData = new FormData(form);
        showBotLog('⏳ ফাইল প্রিলোড হচ্ছে...', '#1e3a8a', '#60a5fa');

        let res = await fetch('/pre-load', { method: 'POST', body: formData });
        let data = await res.json();
        
        if(data.status === 'queued') {
            activeSessionKey = data.session_id;
            showBotLog('🟢 বট ব্যাকএন্ডে সচল। আইভ্যাক সার্ভার ট্র্যাকিং শুরু হয়েছে...', '#1e293b', '#e2e8f0');
            trackLoop = setInterval(checkLiveBotProgress, 2000);
        } else {
            showBotLog('❌ ত্রুটি: ' + data.message, '#991b1b', '#f87171');
        }
    }

    async function checkLiveBotProgress() {
        if(!activeSessionKey) return;
        let res = await fetch('/poll-status/' + activeSessionKey);
        let data = await res.json();

        if(data.status === 'server_waiting') {
            showBotLog('🤖 অ্যান্টি-ব্লক মোডে বট আইভ্যাক পোর্টাল খোলার অপেক্ষা করছে...', '#1e293b', '#e2e8f0');
        } else if(data.status === 'processing_fields') {
            showBotLog('⚡ সার্ভার লাইভ! বট তথ্য দিয়ে ফর্ম পূরণ করছে...', '#1e3a8a', '#60a5fa');
        } else if(data.status === 'waiting_for_otp') {
            showBotLog('🔑 ওটিপি পেজ এসেছে! দ্রুত ওটিপি কোডটি টাইপ করুন।', '#854d0e', '#fef08a');
            document.getElementById('otp-zone').style.display = 'block';
        } else if(data.status === 'completed') {
            clearInterval(trackLoop);
            document.getElementById('otp-zone').style.display = 'none';
            if(data.result && data.result.status === 'success') {
                showBotLog('🎉 স্লট সফলভাবে বুকড হয়েছে!', '#065f46', '#34d399');
                document.getElementById('payment-container').innerHTML = `<a href="${data.result.payment_url}" target="_blank" style="display:block;text-align:center;padding:12px;background:#22c55e;color:white;text-decoration:none;border-radius:6px;font-weight:bold;">💳 ম্যানুয়াল পেমেন্ট করুন</a>`;
            } else {
                showBotLog('❌ ব্যর্থ: ' + data.result.message, '#991b1b', '#f87171');
            }
        }
    }

    async function submitAdminOtp() {
        const otp = document.getElementById('otp-val').value;
        if(!otp) return alert('OTP দিন');
        await fetch('/submit-otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ session_id: activeSessionKey, otp: otp })
        });
        document.getElementById('otp-zone').style.display = 'none';
    }

    async function createUserAccount() {
        const username = document.getElementById('new-user').value;
        const password = document.getElementById('new-pass').value;
        const role = document.getElementById('new-role').value;
        if(!username || !password) return alert('সব তথ্য দিন');

        let res = await fetch('/admin/create-user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password, role })
        });
        let data = await res.json();
        alert(data.message);
        if(data.status === 'success') {
